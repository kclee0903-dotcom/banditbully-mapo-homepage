<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고객 리뷰 관리자 | 반딧불이 새집증후군</title>
  <meta name="description" content="반딧불이 새집증후군 고객 리뷰 관리자 화면입니다." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f7f5ef" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="review-admin-page">
  <header class="site-header" data-header>
    <a class="brand" href="index.html#top" aria-label="반딧불이 새집증후군 홈으로 이동">
      <img class="brand__icon" src="bandibuli-icon.png" alt="" aria-hidden="true" />
      <span>반딧불이 새집증후군</span>
    </a>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="index.html#expert">시공정보</a>
      <a href="process.html">시공공정</a>
      <a href="cases.html">시공사례</a>
      <a href="reviews.html">고객 리뷰</a>
      <a href="admin-reviews.html" aria-current="page">리뷰 관리자</a>
    </nav>
    <div class="header-actions" aria-label="리뷰 바로가기">
      <a class="header-phone" href="tel:01099213632">010-9921-3632</a>
      <a class="header-cta" href="reviews.html">리뷰 보기</a>
    </div>
  </header>

  <main id="top">
    <section class="section admin-hero" aria-labelledby="review-admin-title">
      <div class="section-heading reveal">
        <p class="eyebrow">Review admin</p>
        <h1 id="review-admin-title">고객 리뷰 관리자</h1>
        <p>관리자 로그인 후 고객 리뷰를 작성, 수정, 삭제하고 후기 이미지를 업로드할 수 있습니다.</p>
      </div>
    </section>

    <section class="section admin-login-section" data-login-panel aria-label="관리자 로그인">
      <form class="admin-login-form reveal-card" data-login-form>
        <h2>관리자 로그인</h2>
        <p>리뷰 관리는 환경변수로 설정된 관리자 계정으로만 접근할 수 있습니다.</p>
        <label class="admin-field">
          <span>아이디</span>
          <input name="id" type="text" autocomplete="username" required />
        </label>
        <label class="admin-field">
          <span>비밀번호</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="admin-error" data-login-error aria-live="polite"></p>
        <button class="button button--primary" type="submit">로그인</button>
      </form>
    </section>

    <section class="section admin-workspace" data-review-admin hidden aria-label="고객 리뷰 작성과 관리">
      <form class="case-admin-form reveal-card" data-review-form>
        <input type="hidden" name="id" />
        <input type="hidden" name="imageUrl" />
        <input type="hidden" name="imageAlt" />
        <div class="admin-toolbar">
          <strong data-review-form-mode>새 리뷰 작성</strong>
          <div>
            <button class="button button--secondary" type="button" data-new-review>새 리뷰</button>
            <button class="button button--primary" type="submit">저장</button>
          </div>
        </div>

        <p class="privacy-notice">카카오톡 캡처, 고객명, 전화번호, 주소, 동호수 등 개인정보가 포함된 이미지는 반드시 가린 뒤 업로드해주세요.</p>

        <div class="admin-grid-two">
          <label class="admin-field">
            <span>고객명 또는 닉네임</span>
            <input name="name" type="text" placeholder="예: 마포 입주 고객" required />
          </label>
          <label class="admin-field">
            <span>현장 유형</span>
            <select name="siteType" required data-review-site-type></select>
          </label>
        </div>

        <div class="admin-grid-two">
          <label class="admin-field">
            <span>지역 또는 현장명</span>
            <input name="location" type="text" placeholder="예: 마포구 신축 아파트" required />
          </label>
          <label class="admin-field">
            <span>별점</span>
            <select name="rating" required>
              <option value="5">★★★★★ 5점</option>
              <option value="4">★★★★☆ 4점</option>
              <option value="3">★★★☆☆ 3점</option>
              <option value="2">★★☆☆☆ 2점</option>
              <option value="1">★☆☆☆☆ 1점</option>
            </select>
          </label>
        </div>

        <label class="admin-field admin-field--wide">
          <span>리뷰 내용</span>
          <textarea name="content" rows="8" placeholder="고객이 남긴 후기 내용을 입력해주세요." required></textarea>
        </label>

        <label class="admin-field admin-field--wide">
          <span>시공 후 느낀 점</span>
          <textarea name="afterNote" rows="6" placeholder="시공 후 변화, 안내받은 점 등을 입력해주세요." required></textarea>
        </label>

        <label class="admin-field">
          <span>작성일</span>
          <input name="reviewDate" type="date" required />
        </label>

        <div class="admin-upload-panel">
          <label class="admin-uploader">
            <span>고객 후기 이미지 또는 카카오톡 후기 이미지</span>
            <input type="file" accept="image/jpeg,image/png,image/webp" data-review-image-input />
            <small>jpg, jpeg, png, webp 파일만 가능하며 5MB 이하로 업로드해주세요.</small>
          </label>
          <div class="review-image-preview" data-review-image-preview></div>
        </div>

        <div class="admin-submit-row">
          <button class="button button--secondary" type="button" data-new-review>초기화</button>
          <button class="button button--primary" type="submit">저장</button>
        </div>
      </form>

      <aside class="admin-posts reveal-card" aria-labelledby="review-posts-title">
        <div class="admin-posts__head">
          <h2 id="review-posts-title">등록된 고객 리뷰</h2>
          <button class="button button--secondary" type="button" data-logout>로그아웃</button>
        </div>
        <div data-admin-review-posts></div>
      </aside>
    </section>
  </main>

  <button class="top-button" type="button" data-top-button aria-label="맨 위로 이동" aria-hidden="true">↑</button>
  <script src="review-board.js"></script>
  <script src="review-admin.js"></script>
  <script src="script.js"></script>
</body>
</html>
