<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인 | 반딧불이 새집증후군</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f7f5ef" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="review-admin-page">
  <header class="site-header" data-header>
    <a class="brand" href="../index.html#top" aria-label="반딧불이 새집증후군 홈으로 이동">
      <img class="brand__icon" src="../bandibuli-icon.png" alt="" aria-hidden="true" />
      <span>반딧불이 새집증후군</span>
    </a>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="../index.html#expert">시공정보</a>
      <a href="../process.html">시공공정</a>
      <a href="../cases.html">시공사례</a>
      <a href="../reviews.html">고객 리뷰</a>
    </nav>
  </header>

  <main id="top">
    <section class="review-hero section" aria-labelledby="admin-login-title">
      <div class="section-heading reveal">
        <p class="eyebrow">Admin login</p>
        <h1 id="admin-login-title">관리자 로그인</h1>
        <p>Supabase Auth에 등록된 관리자 계정으로 로그인해주세요.</p>
      </div>
    </section>
    <section class="section admin-login-section">
      <form class="admin-login-form reveal-card" data-admin-login-form>
        <h2>리뷰 관리자 로그인</h2>
        <label class="admin-field">아이디 또는 이메일
          <input name="email" type="email" autocomplete="username" required />
        </label>
        <label class="admin-field">비밀번호
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="admin-error" data-admin-login-error aria-live="polite"></p>
        <button class="button button--primary" type="submit">로그인</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="login.js"></script>
  <script src="../script.js"></script>
</body>
</html>
